name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nenhum job aqui escreve no repositório.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint + test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # Mesma versão fixada em .mise.toml — dev e CI não divergem.
          python-version: "3.13"
          enable-cache: true
      # --locked falha se uv.lock estiver dessincronizado do pyproject.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Modelos e migrações não divergem
        # Os testes rodam o upgrade, mas não percebem uma coluna nova em
        # app/db/models.py sem migração; o check compara os dois.
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/alembic-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  web:
    name: lint + build + test (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          # Relativo à raiz: o working-directory acima não vale para `with:`.
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # --frozen-lockfile falha se o lockfile não bater com o package.json.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # O build do Next não checa tipos de arquivos não importados; tsc sim.
      - run: pnpm typecheck
      - run: pnpm test
      - name: A registry publicada tem que bater com a fonte
        # public/r/ é gerado a partir de registry/. Sem esta checagem ele
        # envelhece em silêncio e quem roda `shadcn add @gmui/...` recebe a
        # versão de meses atrás.
        run: |
          pnpm registry:build
          git diff --exit-code public/r
      - run: pnpm build
        env:
          # Canário: se esta chave aparecer no bundle, ela vazou de verdade.
          LEAD_ROUTER_API_KEY: canario-do-ci-nao-pode-vazar
      - name: A chave não pode estar no bundle do browser
        run: "! grep -rq canario-do-ci-nao-pode-vazar .next/static"

  security:
    name: segredos + dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks varre o histórico inteiro, não só o diff
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Exportar dependências de runtime
        run: uv export --format requirements-txt --no-emit-project --no-dev -o requirements-audit.txt
      - name: Auditar CVEs do backend
        run: uvx pip-audit -r requirements-audit.txt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - name: Auditar CVEs do web
        working-directory: web
        run: pnpm audit --audit-level high

  docker:
    name: build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prova que o Dockerfile constrói; não publica nada.
      - run: docker build -t lead-router .
