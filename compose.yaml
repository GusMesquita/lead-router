# Sobe a pilha inteira: fila, API, worker e dashboard. A API sozinha aceita
# leads mas nunca os processa — por isso o worker é serviço, não um extra opcional.
services:
  redis:
    image: redis:8-alpine
    # Sem porta publicada: quem fala com o Redis é a rede interna do compose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Migração antes de servir: o schema é do Alembic, não de create_all.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    # Aqui e não no Dockerfile: a mesma imagem roda o worker, que não serve HTTP.
    # python em vez de curl porque a imagem slim não tem curl.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      # Cobre o `alembic upgrade head` que roda antes do uvicorn.
      start_period: 20s
    environment: &app_env
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_KEYS: ${API_KEYS:-}
      # O dashboard chama a API pelo servidor, não pelo browser (ver .env.example).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      OUTBOUND_WEBHOOK_URL: ${OUTBOUND_WEBHOOK_URL:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      MIN_SCORE_TO_DISPATCH: ${MIN_SCORE_TO_DISPATCH:-60}
      REDIS_URL: redis://redis:6379
      # Arquivo único no volume compartilhado: API e worker enxergam o mesmo
      # banco. Em produção troque por postgresql+asyncpg:// e nada mais muda.
      DATABASE_URL: sqlite+aiosqlite:////data/lead_router.db
    volumes:
      - lead_data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: arq app.worker.WorkerSettings
    # O arq encerra o processo quando perde o Redis; sem restart, uma queda
    # rápida da fila deixava os jobs parados até alguém subir o worker à mão.
    restart: unless-stopped
    environment: *app_env
    volumes:
      - lead_data:/data
    depends_on:
      # Saudável = a migração já rodou; antes disso o worker veria o banco
      # sem a tabela.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      # Contexto na raiz para o build conferir o Node contra o .nvmrc.
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # node em vez de curl pelo mesmo motivo da API: a imagem slim não tem curl.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/design-system').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      # O servidor Next chama a API pelo DNS do compose, não por localhost: dentro
      # deste container, localhost:8000 é ele mesmo. O browser nunca fala com a
      # API — por isso CORS_ORIGINS segue vazio.
      LEAD_ROUTER_URL: http://api:8000
      # Uma das API_KEYS (vazio basta com ENVIRONMENT=dev e API_KEYS vazio). Só
      # o servidor lê; nunca NEXT_PUBLIC_.
      LEAD_ROUTER_API_KEY: ${LEAD_ROUTER_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  lead_data:
